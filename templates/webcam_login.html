<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern-Based Authentication</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 30px auto;
        text-align: center;
        background: #f4f4f4;
    }

    h1 {
        margin-bottom: 10px;
    }

    .video-wrapper {
        position: relative;
        display: inline-block;
        width: 100%;
        max-width: 640px;
        margin-top: 15px;
        overflow: hidden;
        border-radius: 12px;
    }

    video {
        width: 100%;
        border: 2px solid #333;
        border-radius: 12px;
        background: black;
    }

    .face-guide {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 38%;
        height: 70%;
        transform: translate(-50%, -50%);
        border: 4px dashed red;
        border-radius: 50% / 45%;
        pointer-events: none;
        box-sizing: border-box;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        display: none;
    }

    .face-guide.red{
        border-color: red;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }

    .face-guide.yellow{
        border-color: orange;
        box-shadow: 0 0 15px rgba(255, 165, 0, 0.5);
    }

    .face-guide.green{
        border-color: limegreen;
        box-shadow: 0 0 15px rgba(50, 205, 50, 0.6);
    }

    input, button {
        padding: 10px;
        margin: 10px 5px;
        font-size: 16px;
    }

    .panel {
        margin-top: 15px;
        padding: 14px;
        background: white;
        border-radius: 8px;
        min-height: 40px;
    }

    .success {
        color: green;
        font-weight: bold;
    }

    .error {
        color: red;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>Pattern-Based Facial Authentication</h1>
<p>Align your face in the guide, then click <strong>Verify Identity</strong> and blink once.</p>

<input type="text" id="username" placeholder="Enter username">
<br>

<div class="video-wrapper">
    <video id="video" autoplay playsinline></video>
    <div class="face-guide" id="faceGuide"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<br>
<button id="startCamera">Start Camera</button>
<button id="verifyIdentity">Verify Identity</button>
<button id="resetAttempt">Reset Attempt</button>

<div id="instruction" class="panel">Instruction will appear here.</div>
<div id="progress" class="panel">Progress will appear here.</div>
<div id="result" class="panel">Result will appear here.</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const instructionDiv = document.getElementById("instruction");
const progressDiv = document.getElementById("progress");
const resultDiv = document.getElementById("result");
const usernameInput = document.getElementById("username");
const faceGuide = document.getElementById("faceGuide");

let streamStarted = false;
let streamRef = null;
let verifying = false;
let detectionLoopRunning = false;
let blinkDetected = false;
let eyesClosedFrames = 0;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
}

function eyeAspectRatio(upper, lower, left, right) {
    const vertical = distance(upper, lower);
    const horizontal = distance(left, right);
    return vertical / horizontal;
}

function resetAttemptState() {
    verifying = false;
    blinkDetected = false;
    eyesClosedFrames = 0;
    instructionDiv.innerHTML = "Attempt reset. Align your face and start again.";
    progressDiv.innerHTML = "Waiting for verification.";
    resultDiv.innerHTML = "Result will appear here.";
}

document.getElementById("resetAttempt").addEventListener("click", () => {
    resetAttemptState();
});

document.getElementById("startCamera").addEventListener("click", async () => {
    try {
        if (streamRef) {
            streamRef.getTracks().forEach(track => track.stop());
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480 },
            audio: false
        });

        streamRef = stream;
        video.srcObject = stream;
        streamStarted = true;

        faceGuide.style.display = "block";

        instructionDiv.innerHTML = "Camera started. Align your face inside the guide.";
        progressDiv.innerHTML = "Waiting for you to begin verification.";
        resultDiv.innerHTML = "Result will appear here.";

        if (!detectionLoopRunning) {
            runDetectionLoop();
        }
    } catch (error) {
        resultDiv.innerHTML = `<span class="error">Camera error: ${error.message}</span>`;
    }
});

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

let latestFaceData = {
    faceDetected: false,
    centered: false,
    eyeRatio: null
};

faceMesh.onResults((results) => {
    latestFaceData = {
        faceDetected: false,
        centered: false,
        eyeRatio: null
    };

    if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        faceGuide.className = "face-guide red";
        return;
    }

    const face = results.multiFaceLandmarks[0];

    const leftEAR = eyeAspectRatio(face[159], face[145], face[33], face[133]);
    const rightEAR = eyeAspectRatio(face[386], face[374], face[362], face[263]);
    const avgEAR = (leftEAR + rightEAR) / 2;

    const nose = face[1];
    const centeredX = nose.x > 0.40 && nose.x < 0.60;
    const centeredY = nose.y > 0.30 && nose.y < 0.70;

    let centered = centeredX && centeredY;

    latestFaceData = {
        faceDetected: true,
        centered: centered,
        eyeRatio: avgEAR
    };

    if (centered) {
        faceGuide.className = "face-guide green";
    } else {
        faceGuide.className = "face-guide yellow";
    }

    if (!verifying) {
        return;
    }

    if (!latestFaceData.centered) {
        instructionDiv.innerHTML = "Please center your face inside the guide.";
        progressDiv.innerHTML = "Face detected but not well aligned.";
        return;
    }

    instructionDiv.innerHTML = "Blink once. Keep your face steady.";
    progressDiv.innerHTML = `Blink detection active. Eye ratio: ${avgEAR.toFixed(3)}`;

    if (avgEAR < 0.18) {
        eyesClosedFrames += 1;
    } else {
        if (eyesClosedFrames >= 2) {
            blinkDetected = true;
        }
        eyesClosedFrames = 0;
    }
});

async function runDetectionLoop() {
    detectionLoopRunning = true;

    while (video.srcObject) {
        try {
            await faceMesh.send({ image: video });
        } catch (error) {
            console.log("Face mesh error:", error);
        }
        await sleep(120);
    }

    detectionLoopRunning = false;
}

document.getElementById("verifyIdentity").addEventListener("click", async () => {
    const username = usernameInput.value.trim();

    if (!username) {
        resultDiv.innerHTML = `<span class="error">Please enter username.</span>`;
        return;
    }

    if (!streamStarted || !video.srcObject) {
        resultDiv.innerHTML = `<span class="error">Please start camera first.</span>`;
        return;
    }

    resetAttemptState();
    verifying = true;
    instructionDiv.innerHTML = "Align your face and blink once.";
    progressDiv.innerHTML = "Preparing verification...";

    let waitTime = 0;
    while (waitTime < 10000) {
        if (!latestFaceData.faceDetected) {
            instructionDiv.innerHTML = "No face detected. Position your face in the guide.";
        } else if (!latestFaceData.centered) {
            instructionDiv.innerHTML = "Face detected. Move into the center guide.";
        } else if (blinkDetected) {
            break;
        }

        await sleep(150);
        waitTime += 150;
    }

    if (!blinkDetected) {
        verifying = false;
        resultDiv.innerHTML = `<span class="error">Blink not detected. Please try again.</span>`;
        progressDiv.innerHTML = "Verification stopped.";
        return;
    }

    instructionDiv.innerHTML = `<span class="success">Blink confirmed. Hold still for capture.</span>`;
    progressDiv.innerHTML = "Capturing live frames...";
    await sleep(500);

    const context = canvas.getContext("2d");
    canvas.width = 640;
    canvas.height = 480;

    const formData = new FormData();
    formData.append("username", username);
    formData.append("liveness_passed", "true");

    for (let i = 0; i < 3; i++) {
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/jpeg", 0.95);
        });

        formData.append("images", blob, `frame_${i + 1}.jpg`);
        progressDiv.innerHTML = `Captured frame ${i + 1} of 3`;
        await sleep(400);
    }

    progressDiv.innerHTML = "Sending frames for authentication...";
    verifying = false;

    try {
        const response = await fetch("/api/login-multiframe/", {
            method: "POST",
            body: formData
        });

        const contentType = response.headers.get("content-type") || "";

        if (!contentType.includes("application/json")) {
            const text = await response.text();
            resultDiv.innerHTML = `<span class="error">Unexpected server response.</span><br><small>${text.substring(0, 300)}</small>`;
            return;
        }

        const data = await response.json();

        resultDiv.innerHTML = `
            <strong>Status:</strong> ${data.status || data.error}<br>
            <strong>Average Distance:</strong> ${data.average_distance ?? "N/A"}<br>
            <strong>Valid Frames:</strong> ${data.valid_frames ?? "N/A"}<br>
            <strong>Threshold:</strong> ${data.threshold ?? "N/A"}
        `;

        progressDiv.innerHTML = data.all_distances
            ? `Frame distances: ${data.all_distances.join(", ")}`
            : "No frame distance details available.";

        if (data.status === "Access Granted") {
            instructionDiv.innerHTML = `<span class="success">Authentication successful. Redirecting...</span>`;
            sessionStorage.setItem("username", username); // ← the only new line added
            setTimeout(() => {
                window.location.href = "/dashboard/";
            }, 1500);
        } else {
            instructionDiv.innerHTML = "Authentication denied. You may reset and try again.";
        }

    } catch (error) {
        resultDiv.innerHTML = `<span class="error">Request failed: ${error.message}</span>`;
    }
});
</script>

</body>
</html>
